# Si — canonical PBC + pseudopotential benchmark.
# Two-atom diamond-structure conventional cell. The cheap, well-known
# solid-state regression point; if Si moves, something fundamental
# in the PBC / pseudo path changed.

system:
  name: si
  kind: solid
  geometry:
    lattice:
      a: 5.4307           # Å, experimental
      vectors:
        - [0.0, 0.5, 0.5]
        - [0.5, 0.0, 0.5]
        - [0.5, 0.5, 0.0]
    atoms:
      - { element: Si, frac: [0.00, 0.00, 0.00] }
      - { element: Si, frac: [0.25, 0.25, 0.25] }
  pseudo: gth-pbe          # pyscf-bundled GTH pseudo
  relativistic: none

basis:
  name: gth-dzvp-molopt-sr
  auxbasis: none

init:
  xc: pbe     # DFT-PBE mean-field starting point for init_data_df.py

mesh:
  k: [4, 4, 4]
  beta: 1000
  grid_file: ir/1e4.h5

methods:
  - { type: hf,  itermax: 1 }
  - { type: gf2, itermax: 1 }
  - { type: gw,  itermax: 30, threshold: 1.0e-7 }

observables:
  - { id: total_energy,    units: Ha, since: 0.3.0 }
  - { id: hf_energy,       units: Ha, since: 0.3.0 }
  - { id: one_body_energy, units: Ha, since: 0.3.0 }
  - { id: gw_corr,         units: Ha, since: 0.3.0 }
  - { id: indirect_gap,    units: eV, since: 0.3.0 }
  - { id: direct_gap_gamma,units: eV, since: 0.3.0 }
  - { id: vbm,             units: eV, since: 0.3.0 }
  - { id: cbm,             units: eV, since: 0.3.0 }
