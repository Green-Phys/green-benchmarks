# Na — BCC metal (Im-3m, #229), 1-atom primitive cell.
# Symmorphic cubic metal. a = 4.225 Å (experimental).

system:
  name: na
  kind: solid
  geometry:
    lattice:
      a: 4.225
      vectors:
        - [-0.5000, 0.5000, 0.5000]
        - [0.5000, -0.5000, 0.5000]
        - [0.5000, 0.5000, -0.5000]
    atoms:
      - { element: Na, frac: [0.000000, 0.000000, 0.000000] }
  pseudo: gth-pbe
  relativistic: none

basis:
  name: gth-dzvp-molopt-sr
  auxbasis: none
  etb_beta: 2.5

init:
  xc: pbe     # DFT-PBE mean-field starting point for init_data_df.py

mesh:
  # Na is q9 (gth-pbe): 9 e-/cell is odd. A spin-0 unrestricted mean field
  # needs an even total over the k-set (Nalpha=Nbeta), so nkpts must be even.
  # 3x3x3=27 gives 9*27=243 (odd) -> RuntimeError. 4x4x4=64 -> 576 (even).
  k: [4, 4, 4]
  beta: 100
  grid_file: ir/1e5.h5

methods:
  - { type: gw, itermax: 30, threshold: 1.0e-7 }

gpu_methods:
  # GPU kernel-consistency check: hf x1 + gw x2 (drop gf2), not a converged run.
  - { type: hf, itermax: 1 }
  - { type: gw, itermax: 3, threshold: 1.0e-7 }
