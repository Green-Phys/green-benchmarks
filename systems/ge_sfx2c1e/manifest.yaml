# Ge, all-electron + scalar relativistic (sfx2c1e).
# This benchmark is the headline reason this repo exists: it exercises
# the X2C-scalar code path end-to-end, which the H2/cc-pVDZ unit test
# in green-mbpt/test/solvers_test.cpp cannot reach.
#
# Reference numbers exist in the literature for Ge GW band gap at this
# level; see ADMIN.md when a discrepancy is reported.

system:
  name: ge_sfx2c1e
  kind: solid
  geometry:
    lattice:
      a: 5.658              # Å, experimental Ge lattice constant
      vectors:
        - [0.0, 0.5, 0.5]
        - [0.5, 0.0, 0.5]
        - [0.5, 0.5, 0.0]
    atoms:
      - { element: Ge, frac: [0.00, 0.00, 0.00] }
      - { element: Ge, frac: [0.25, 0.25, 0.25] }
  pseudo: none              # all-electron
  relativistic: sfx2c1e     # scalar-relativistic X2C

basis:
  name: x2c-svpall
  auxbasis: def2-universal-jkfit   # JK-fit aux basis (all-electron: must be explicit)
  etb_beta: 3.0                    # even-tempered-basis ratio -> init --beta (NOT mesh.beta)

init:
  xc: pbe     # DFT-PBE mean-field starting point

mesh:
  k: [3, 3, 3]
  beta: 100
  grid_file: ir/1e6.h5   # matches the validated manual runs

methods:
  # All-electron Ge: GF2 is omitted by request (cost vs. value).
  # Cross-version reproducibility: HF runs 2 iterations, GW 20 (PBE seed,
  # def2-universal-jkfit aux). Analytic continuation runs for the GW
  # spectral observables (vbm/cbm/gaps).
  - { type: hf, itermax: 2 }
  - { type: gw, itermax: 20, threshold: 1.0e-9 }

gpu_methods:
  # GPU kernel-consistency check: hf x1 + gw x2, not a converged run.
  - { type: hf, itermax: 1 }
  - { type: gw, itermax: 2, threshold: 1.0e-9 }
