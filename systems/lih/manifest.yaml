# LiH — rock-salt (Fm-3m, #225), 2-atom primitive cell.
# Cubic ionic insulator, symmorphic. a = 4.083 Å (experimental).

system:
  name: lih
  kind: solid
  geometry:
    lattice:
      a: 4.083
      vectors:
        - [0.0000, 0.5000, 0.5000]
        - [0.5000, 0.0000, 0.5000]
        - [0.5000, 0.5000, 0.0000]
    atoms:
      - { element: Li, frac: [0.000000, 0.000000, 0.000000] }
      - { element: H , frac: [0.500000, 0.500000, 0.500000] }
  pseudo: gth-pbe
  relativistic: none

basis:
  name: gth-dzvp-molopt-sr
  # Explicit RI aux basis. The auto-generated even-tempered aux (auxbasis: none,
  # etb_beta: 2.5) is near-linearly-dependent for this cell: j2c condition number
  # ~1e16, so the metric eigendecomposition drops a *ragged*, q-dependent number
  # of aux vectors. Under v1.0.0's aux-space symmetry reduction that makes
  # symmetry/q/k_sym_transform_p0 ill-defined (ragged rank 93-96/108 across the
  # star), corrupting the density-fitted integrals at the reconstructed q-points
  # (HF off ~20 mHa, E_corr off ~40 mHa vs v0.3.2). An explicit,
  # well-conditioned aux basis avoids this: no dropped functions, uniform
  # full-rank p0 across the star.
  auxbasis: def2-universal-jkfit

init:
  xc: pbe     # DFT-PBE mean-field starting point for init_data_df.py

mesh:
  k: [3, 3, 3]
  beta: 100
  grid_file: ir/1e5.h5

methods:
  - { type: gw, itermax: 30, threshold: 1.0e-7 }

gpu_methods:
  # GPU kernel-consistency check: hf x1 + gw x2 (drop gf2), not a converged run.
  - { type: hf, itermax: 1 }
  - { type: gw, itermax: 3, threshold: 1.0e-7 }
