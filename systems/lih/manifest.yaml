# LiH — rock-salt (Fm-3m, #225), 2-atom primitive cell.
# Cubic ionic insulator, symmorphic. a = 4.083 Å (experimental).

system:
  name: lih
  kind: solid
  geometry:
    lattice:
      a: 4.083
      vectors:
        - [0.0000, 0.5000, 0.5000]
        - [0.5000, 0.0000, 0.5000]
        - [0.5000, 0.5000, 0.0000]
    atoms:
      - { element: Li, frac: [0.000000, 0.000000, 0.000000] }
      - { element: H , frac: [0.500000, 0.500000, 0.500000] }
  pseudo: gth-pbe
  relativistic: none

basis:
  name: gth-dzvp-molopt-sr
  auxbasis: none
  etb_beta: 2.5

init:
  xc: pbe     # DFT-PBE mean-field starting point for init_data_df.py

mesh:
  k: [3, 3, 3]
  beta: 100
  grid_file: ir/1e5.h5

methods:
  - { type: gw, itermax: 30, threshold: 1.0e-7 }

gpu_methods:
  # GPU kernel-consistency check: hf x1 + gw x2 (drop gf2), not a converged run.
  - { type: hf, itermax: 1 }
  - { type: gw, itermax: 3, threshold: 1.0e-7 }
