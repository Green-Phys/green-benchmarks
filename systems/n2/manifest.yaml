# N2 — molecular correlation sanity benchmark.
# Cheapest of the four systems; primary purpose is to catch gross
# regressions in the molecular code path before the more expensive
# solid-state runs hit the queue.

system:
  name: n2
  kind: molecular
  geometry:
    atoms:
      - { element: N, xyz: [0.0, 0.0,  0.5488] }
      - { element: N, xyz: [0.0, 0.0, -0.5488] }
    units: angstrom
  charge: 0
  spin: 0
  pseudo: none
  relativistic: none

basis:
  name: cc-pvdz
  auxbasis: cc-pvdz-jkfit

init:
  xc: hf      # mean-field starting point for init_data_mol_df.py

mesh:
  # mean-field temperature / imaginary-time grid for the GF2/GW solver
  beta: 100
  grid_file: ir/1e5.h5

methods:
  # CPU plan. All systems run hf + gw; N2 and Si additionally get a single-iter
  # GF2 as a cheap correlation cross-check.
  - { type: hf,  itermax: 1 }
  - { type: gf2, itermax: 1 }
  - { type: gw,  itermax: 30, threshold: 1.0e-7 }

gpu_methods:
  # GPU plan — a quick kernel-consistency check, not a converged run: just
  # 1 HF iteration and 2 GW iterations. Self-contained (own itermax/threshold).
  - { type: hf, itermax: 1 }
  - { type: gw, itermax: 2, threshold: 1.0e-7 }
  # Same GW with the cuda low-memory path OFF, to check it against the default
  # (low-memory) GPU run. Lands as 'gw_fullmem' beside 'gw' in the _gpu JSON.
  - { type: gw, output_tag: gw_fullmem, itermax: 2, threshold: 1.0e-7,
      cuda_low_gpu_memory: false, cuda_low_cpu_memory: false }
