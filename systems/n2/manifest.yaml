# N2 — molecular correlation sanity benchmark.
# Cheapest of the four systems; primary purpose is to catch gross
# regressions in the molecular code path before the more expensive
# solid-state runs hit the queue.

system:
  name: n2
  kind: molecular
  geometry:
    atoms:
      - { element: N, xyz: [0.0, 0.0,  0.5488] }
      - { element: N, xyz: [0.0, 0.0, -0.5488] }
    units: angstrom
  charge: 0
  spin: 0
  pseudo: none
  relativistic: none

basis:
  name: cc-pvdz
  auxbasis: cc-pvdz-jkfit

init:
  xc: hf      # mean-field starting point for init_data_mol_df.py

mesh:
  # mean-field temperature / imaginary-time grid for the GF2/GW solver
  beta: 100
  grid_file: ir/1e5.h5

methods:
  # All systems run hf + gw. N2 and Si additionally get a single-iter GF2
  # as a cheap correlation cross-check.
  - { type: hf,  itermax: 1 }
  - { type: gf2, itermax: 1 }
  - { type: gw,  itermax: 30, threshold: 1.0e-7 }
  # GPU-only cross-check: the same GW with the cuda low-memory path OFF, to
  # verify it matches the default (low-memory) GPU run. Runs only on GPU and
  # lands as method 'gw_fullmem' alongside 'gw' in the _gpu result JSON.
  - { type: gw, name: gw_fullmem, kernel: gpu, itermax: 30, threshold: 1.0e-7,
      cuda_low_gpu_memory: false, cuda_low_cpu_memory: false }
