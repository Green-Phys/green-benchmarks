# Diamond (C) — diamond structure (Fd-3m, #227), 2-atom primitive cell.
# Isostructural with Si, lighter atoms. a = 3.567 Å (experimental).

system:
  name: diamond
  kind: solid
  geometry:
    lattice:
      a: 3.567
      vectors:
        - [0.0000, 0.5000, 0.5000]
        - [0.5000, 0.0000, 0.5000]
        - [0.5000, 0.5000, 0.0000]
    atoms:
      - { element: C , frac: [0.000000, 0.000000, 0.000000] }
      - { element: C , frac: [0.250000, 0.250000, 0.250000] }
  pseudo: gth-pbe
  relativistic: none

basis:
  name: gth-dzvp-molopt-sr
  auxbasis: none
  beta: 2.5

init:
  xc: pbe     # DFT-PBE mean-field starting point for init_data_df.py

mesh:
  k: [3, 3, 3]
  beta: 100
  grid_file: ir/1e5.h5

methods:
  - { type: gw, itermax: 30, threshold: 1.0e-7 }
